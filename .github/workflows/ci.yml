name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show commit information
        run: |
          echo "Commit:"
          git rev-parse HEAD
          echo "Author:"
          git log -1 --pretty=format:'%an'

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          sleep 5

      - name: Run tests
        run: |
          echo "Running tests..."
          sleep 10
          echo "Tests passed"

      - name: Build application
        run: |
          echo "Building application..."
          sleep 10
          echo "Build completed"

      - name: Publish build result
        run: |
          echo "CI completed successfully"
