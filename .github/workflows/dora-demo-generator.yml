name: DORA Demo Generator

on:

  workflow_dispatch:

    inputs:

      iterations:
        description: "Number of DORA scenarios to generate"
        required: true
        default: "15"


permissions:

  contents: write
  pull-requests: write
  actions: write


env:

  GH_TOKEN: ${{ secrets.DORA_DEMO_TOKEN }}
  REPO: testorg202686/dora-demo


jobs:

  generate-dora-data:

    name: Generate Historical DORA Data

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Configure Git

        run: |

          git config user.name "dora-demo-bot"

          git config user.email "dora-demo@users.noreply.github.com"



      - name: Generate DORA scenarios

        run: |

          ITERATIONS=${{ github.event.inputs.iterations }}

          echo "Generating $ITERATIONS historical DORA scenarios"



          for i in $(seq 1 $ITERATIONS)

          do


            echo "================================="
            echo "Scenario $i"
            echo "================================="



            #
            # Generate historical date
            #
            DAYS_AGO=$((i))

            EVENT_DATE=$(date \
              -d "-${DAYS_AGO} days" \
              '+%Y-%m-%dT12:00:00')



            BRANCH="feature/dora-demo-$i-$(date +%s)"



            echo "Using historical date:"
            echo $EVENT_DATE



            git checkout main

            git pull



            git checkout -b $BRANCH



            echo "DORA historical change $i" >> dora-demo.txt



            git add dora-demo.txt



            git commit \
              --date="$EVENT_DATE" \
              -m "feat: DORA historical change $i"



            git push origin $BRANCH



            echo "Creating PR"



            gh pr create \
              --repo $REPO \
              --title "DORA Historical Change $i" \
              --body "Automated DORA scenario $i" \
              --base main \
              --head $BRANCH



            sleep 10



            PR=$(gh pr list \
              --repo $REPO \
              --head $BRANCH \
              --json number \
              --jq '.[0].number')



            echo "Merging PR $PR"



            gh pr merge $PR \
              --repo $REPO \
              --merge \
              --delete-branch



            sleep 15



            echo "Starting DEV deployment"



            gh workflow run deploy-demo.yml \
              --repo $REPO \
              -f environment=DEV



            sleep 15



            echo "Starting STAGING deployment"



            gh workflow run deploy-demo.yml \
              --repo $REPO \
              -f environment=STAGING



            sleep 15



            echo "Starting PRODUCTION deployment"



            gh workflow run deploy-demo.yml \
              --repo $REPO \
              -f environment=PRODUCTION



            sleep 20



          done
