name: DORA Demo Generator

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of DORA scenarios to generate"
        required: true
        default: "5"

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ secrets.DORA_DEMO_TOKEN }}
  REPO: testorg202686/dora-demo


jobs:

  generate-dora-data:

    name: Generate DORA Events
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure Git
        run: |
          git config user.name "dora-demo-bot"
          git config user.email "dora-demo@users.noreply.github.com"


      - name: Generate DORA scenarios
        run: |

          ITERATIONS=${{ github.event.inputs.iterations }}

          echo "Generating $ITERATIONS DORA scenarios"


          for i in $(seq 1 $ITERATIONS)
          do

            echo "================================="
            echo "Generating scenario $i"
            echo "================================="


            BRANCH="feature/dora-demo-$i-$(date +%s)"


            echo "Creating branch $BRANCH"


            git checkout main

            git pull


            git checkout -b $BRANCH


            echo "DORA demo change $i $(date)" >> dora-demo.txt


            git add dora-demo.txt

            git commit \
              -m "feat: DORA demo change $i"


            git push origin $BRANCH



            echo "Creating Pull Request"


            gh pr create \
              --repo $REPO \
              --title "DORA Demo Change $i" \
              --body "Automated DORA demo PR $i" \
              --base main \
              --head $BRANCH



            echo "Waiting before merge"

            sleep 30



            PR=$(gh pr list \
              --repo $REPO \
              --head $BRANCH \
              --json number \
              --jq '.[0].number')


            echo "Merging PR $PR"


            gh pr merge $PR \
              --repo $REPO \
              --merge \
              --delete-branch



            echo "Waiting for merge"

            sleep 30



            echo "Simulating DEV deployment"

            gh workflow run \
              --repo $REPO \
              deploy-demo.yml \
              -f environment=DEV



            sleep 30



            echo "Simulating STAGING deployment"

            gh workflow run \
              --repo $REPO \
              deploy-demo.yml \
              -f environment=STAGING



            sleep 30



            echo "Simulating PRODUCTION deployment"

            gh workflow run \
              --repo $REPO \
              deploy-demo.yml \
              -f environment=PRODUCTION



            sleep 60


          done
