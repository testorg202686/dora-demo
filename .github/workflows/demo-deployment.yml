name: Demo Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Simulate deployment
        run: |
          echo "Deploying..."

      - name: Simulate failure
        if: github.run_number % 3 == 0
        run: |
          echo "Deployment failed"
          exit 1

      - name: Deployment successful
        run: |
          echo "Deployment completed"
