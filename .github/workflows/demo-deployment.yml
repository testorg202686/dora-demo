name: Demo Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Simulate deployment
        run: |
          echo "Deploying..."

      - name: Simulate failure
        run: |
          if [ $(( ${{ github.run_number }} % 3 )) -eq 0 ]; then
            echo "Simulating deployment failure"
            exit 1
          else
            echo "Deployment successful"
          fi
